dialog.about.text=Una autopista, un río y tierra verde. Traza calles, define zonas de viviendas, comercios e industria, y lleva electricidad y agua: la ciudad crece sola donde la gente quiere vivir y trabajar. Mantén en equilibrio viviendas, comercios y empleos, construye escuelas, una biblioteca y parques, y vigila el presupuesto. Tres misiones; se guarda la victoria más rápida de cada una.
dialog.about.rules=Elige una herramienta en el panel o con las teclas 1 a 9. Arrastra calles, líneas eléctricas, zonas y la excavadora sobre el mapa; coloca los edificios con un clic. El botón derecho cancela o, mantenido, mueve el mapa. Un solar crece cuando su zona tiene demanda, una calle lleva a la autopista, tiene electricidad y, desde el segundo nivel, agua. Z o la rueda acercan y alejan, O muestra electricidad, agua, valor del suelo y contaminación, B el presupuesto, + y - cambian la velocidad, F5 guarda, F9 carga.

