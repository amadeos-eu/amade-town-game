help.road=Arrastra de casilla en casilla. Solo las calles que llevan a la autopista traen gente. Un puente debe ir recto.
help.homes=Arrastra un rectángulo. Las viviendas crecen junto a una calle, con electricidad; desde el segundo nivel necesitan agua.
help.shops=Arrastra un rectángulo. Los comercios crecen donde hay gente que compra.
help.industry=Arrastra un rectángulo. La industria da empleo y pone en marcha una ciudad, pero echa humo.
help.bulldoze=Arrastra sobre lo que debe irse: edificios, calles, líneas, árboles, zonas vacías.
help.tax=Más impuestos: más dinero, pero menos gente.

