hint.unpowered=Certaines zones n’ont pas d’électricité : tirez une ligne jusqu’à elles.
hint.no_water=Les gens veulent de l’eau : construisez une station de pompage au bord de l’eau et un château d’eau.
hint.water_short=Pas assez d’eau : construisez une autre station de pompage.
hint.no_jobs=Les gens veulent du travail : délimitez des commerces ou de l’industrie.
hint.no_homes=Des emplois attendent : délimitez plus d’habitat.
hint.no_shops=Les gens veulent faire leurs courses : délimitez des commerces.
