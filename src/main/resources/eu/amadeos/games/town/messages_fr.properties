window.title=Town
menu.game.pause=&Pause
menu.game.sound=&Son
dialog.about.text=Une autoroute, une rivière et des terres vertes. Tracez des rues, délimitez des zones d’habitation, de commerce et d’industrie, et amenez l’électricité et l’eau : la ville grandit d’elle-même là où les gens veulent vivre et travailler. Gardez l’équilibre entre logements, commerces et emplois, construisez des écoles, une bibliothèque et des parcs, et surveillez le budget. Trois missions ; la victoire la plus rapide de chacune est enregistrée.
dialog.about.rules=Choisissez un outil dans le panneau ou avec les touches 1 à 9. Faites glisser les rues, les lignes électriques, les zones et le bulldozer sur la carte ; posez les bâtiments d’un clic. Le bouton droit annule ou, maintenu, déplace la carte. Une parcelle grandit quand sa zone est demandée, qu’une rue mène à l’autoroute, qu’elle a l’électricité et, dès le deuxième niveau, l’eau. Z ou la molette zooment, O montre l’électricité, l’eau, la valeur du terrain et la pollution, B le budget, + et - changent la vitesse, F5 enregistre, F9 charge.

