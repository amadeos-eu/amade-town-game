help.road=Faites glisser de case en case. Seules les rues qui mènent à l’autoroute amènent des gens. Un pont doit être droit.
help.homes=Faites glisser un rectangle. Les logements poussent près d’une rue, avec l’électricité ; dès le deuxième niveau, il leur faut l’eau.
help.shops=Faites glisser un rectangle. Les commerces poussent là où il y a des clients.
help.industry=Faites glisser un rectangle. L’industrie donne des emplois et lance une ville, mais elle fume.
help.bulldoze=Faites glisser sur ce qui doit partir : bâtiments, rues, lignes, arbres, zones vides.
help.tax=Plus d’impôts : plus d’argent, mais moins d’habitants.

