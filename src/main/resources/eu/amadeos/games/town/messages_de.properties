dialog.about.text=Eine Autobahn, ein Fluss und grünes Land. Lege Straßen, weise Land für Wohnungen, Läden und Industrie aus und bring Strom und Wasser hin: Die Stadt wächst von selbst, wo Menschen wohnen und arbeiten wollen. Halte Wohnungen, Läden und Arbeitsplätze im Gleichgewicht, baue Schulen, eine Bücherei und Parks und behalte die Kasse im Blick. Drei Missionen; der schnellste Sieg jeder Mission wird gespeichert.
dialog.about.rules=Wähle ein Werkzeug in der Leiste oder mit den Tasten 1 bis 9. Straßen, Stromleitungen, Zonen und die Planierraupe ziehst du über die Karte; Gebäude setzt du mit einem Klick. Die rechte Taste bricht ab oder verschiebt, gedrückt gehalten, die Karte. Ein Grundstück wächst, wenn seine Zone gefragt ist, eine Straße zur Autobahn führt, es Strom und ab der zweiten Stufe Wasser hat. Z oder das Mausrad zoomt, O zeigt Strom, Wasser, Bodenwert und Smog, B die Kasse, + und - ändern das Tempo, F5 speichert, F9 lädt.

