title.keys=Die Tasten 1 bis 9 wählen die Werkzeuge · Pfeiltasten, die rechte Taste oder der Bildrand verschieben die Karte
title.load=F9 lädt die gespeicherte Stadt
title.screen=P oder Esc: Pause · O: Ansichten · B: Kasse · Z oder das Mausrad: Zoom · + und -: Tempo · F5: speichern · F11: Vollbild

