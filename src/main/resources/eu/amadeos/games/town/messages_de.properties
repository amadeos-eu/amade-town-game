help.road=Von Feld zu Feld ziehen. Nur Straßen, die zur Autobahn führen, bringen Leute. Eine Brücke muss gerade verlaufen.
help.homes=Ein Rechteck ziehen. Wohnhäuser wachsen an einer Straße, mit Strom; ab der zweiten Stufe brauchen sie Wasser.
help.shops=Ein Rechteck ziehen. Läden wachsen, wo es Leute zum Einkaufen gibt.
help.industry=Ein Rechteck ziehen. Industrie gibt Arbeit und bringt eine Stadt in Gang, macht aber Rauch.
help.bulldoze=Über das ziehen, was weg soll: Gebäude, Straßen, Leitungen, Bäume, leere Zonen.
help.tax=Höhere Steuern: mehr Geld, aber weniger Leute.

