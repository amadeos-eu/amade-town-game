hint.no_shops=Die Leute wollen einkaufen: Weise Läden aus.
hint.pollution=Der Rauch stört die Leute: Halte Industrie von Wohnungen fern, lege Parks an.
hint.school=Die Kinder brauchen eine Schule.
hint.money=Das Geld wird knapp: Erhöhe die Steuern ein wenig oder baue weniger.
hint.debt=Die Stadt hat Schulden: Unter -5.000 $ ist die Mission verloren.

