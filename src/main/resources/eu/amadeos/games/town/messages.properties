dialog.about.text=A highway, a river and green land. Lay roads, zone land for homes, shops and industry, and bring power and water: the town grows by itself where people want to live and work. Keep homes, shops and jobs in balance, build schools, a library and parks, and watch the budget. Three missions; the fastest win of each is saved.
dialog.about.rules=Choose a tool in the panel or with the keys 1 to 9. Drag roads, power lines, zones and the bulldozer across the map; click buildings onto it. The right button cancels or, held down, moves the map. A lot grows when its zone is wanted, a road leads to the highway, it has power and, from the second level, water. Z or the wheel zooms, O shows power, water, land value and pollution, B the budget, + and - change the speed, F5 saves, F9 loads.

title.subtitle=Lay roads · zone the land · bring power and water · watch the town grow
title.start=Click or press Enter: choose a mission
title.mouse=Drag roads, lines and zones across the map · click buildings onto it · the right button cancels
title.keys=Keys 1 to 9 choose the tools · arrow keys, the right button or the edge of the screen move the map
title.load=F9 loads the saved town
title.screen=P or Esc pauses · O overlays · B budget · Z or the wheel zooms · + and - speed · F5 saves · F11 full screen

