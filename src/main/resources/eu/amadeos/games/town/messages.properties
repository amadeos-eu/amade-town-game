help.road=Drag from tile to tile. Only roads that lead to the highway bring people. A bridge must run straight.
help.homes=Drag a rectangle. Homes grow near a road, with power; from the second level they need water.
help.shops=Drag a rectangle. Shops grow where there are people to buy.
help.industry=Drag a rectangle. Industry gives jobs and starts a town, but makes smoke.
help.bulldoze=Drag over what should go: buildings, roads, lines, trees, empty zones.
help.tax=Higher taxes: more money, but fewer people.

