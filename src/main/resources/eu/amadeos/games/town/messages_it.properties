help.road=Trascina da casella a casella. Solo le strade che portano all’autostrada portano gente. Un ponte deve essere dritto.
help.homes=Trascina un rettangolo. Le case crescono vicino a una strada, con la corrente; dal secondo livello serve l’acqua.
help.shops=Trascina un rettangolo. I negozi crescono dove c’è gente che compra.
help.industry=Trascina un rettangolo. L’industria dà lavoro e avvia una città, ma fa fumo.
help.bulldoze=Trascina su ciò che deve sparire: edifici, strade, linee, alberi, zone vuote.
help.tax=Più tasse: più denaro, ma meno gente.

