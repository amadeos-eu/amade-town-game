dialog.about.text=Un’autostrada, un fiume e terra verde. Traccia strade, assegna zone a case, negozi e industria, e porta corrente e acqua: la città cresce da sola dove la gente vuole vivere e lavorare. Tieni in equilibrio case, negozi e posti di lavoro, costruisci scuole, una biblioteca e parchi, e tieni d’occhio il bilancio. Tre missioni; la vittoria più rapida di ognuna viene salvata.
dialog.about.rules=Scegli uno strumento nel pannello o con i tasti da 1 a 9. Trascina strade, linee elettriche, zone e la ruspa sulla mappa; posa gli edifici con un clic. Il tasto destro annulla o, tenuto premuto, sposta la mappa. Un lotto cresce quando la sua zona è richiesta, una strada porta all’autostrada, ha corrente e, dal secondo livello, acqua. Z o la rotella zoomano, O mostra corrente, acqua, valore del terreno e inquinamento, B il bilancio, + e - cambiano la velocità, F5 salva, F9 carica.

